name: Cookbook protocol checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q recipes
      - run: python -m pytest -m 'not live' --junitxml=test-results.xml
      - run: node --experimental-strip-types --test shared/mission-client/src/index.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-results
          path: test-results.xml
