# Paths resolve relative to get-started/docker-compose.yml (the first -f).
services:
  libraos:
    environment:
      LIBRA_OS_CALLBACK_SECRET_COOKBOOK: ${LIBRA_OS_CALLBACK_SECRET_COOKBOOK:?set the same secret as the webhook host}
      LIBRA_OS_CALLBACK_DEV_HOSTS: host.docker.internal:${COOKBOOK_WEBHOOK_PORT:-8080}
      LIBRA_OS_CALLBACK_ALLOWED_HOSTS: host.docker.internal:${COOKBOOK_WEBHOOK_PORT:-8080}
